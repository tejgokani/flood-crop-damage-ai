[project]
name = "fcda"
version = "0.1.0"
description = "AI-Based Crop Flood Damage Assessment from satellite/drone imagery (VIT Tech-a-thon PS-6)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "imbalanced-learn>=0.12",
  "opencv-python-headless>=4.10",
  "pillow>=10.3",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "requests>=2.32",
  "psutil>=5.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.36", "python-pptx>=0.6.23", "jupyter>=1.0", "nbformat>=5.10"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
fcda = "fcda.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fcda"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

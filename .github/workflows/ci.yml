name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv venv --python 3.12 .venv

      # Torch comes from its own CPU index, installed on its own. Passing that index as an
      # --extra-index-url for the whole install makes uv resolve every package against it,
      # and it carries an ancient `requests`, which makes the resolution unsatisfiable.
      - name: Install CPU PyTorch
        run: |
          uv pip install --python .venv/bin/python \
            --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install package
        run: uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        run: .venv/bin/ruff check src tests

      - name: Unit tests
        run: .venv/bin/pytest tests/ -q

      - name: Offline smoke pipeline
        run: .venv/bin/python -m fcda.cli smoke
